name: App de iPhone

# Compila un .ipa sin firmar. Se instala con Sideloadly (Windows/macOS),
# que lo firma con tu Apple ID al instalarlo.

on:
  push:
    branches: [main]
    paths: ['web/**', 'native/**', 'scripts/**', 'resources/**', 'package*.json', 'capacitor.config.json', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias y web
        run: |
          npm ci
          npm run build

      - name: Proyecto iOS
        run: |
          npx cap add ios
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'Crema usa Bluetooth para conectarse a tu cafetera.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'Crema usa Bluetooth para conectarse a tu cafetera.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :UIStatusBarStyle UIStatusBarStyleLightContent" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" "$PLIST"
          cp resources/icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          npx cap sync ios

      - name: Compilar (sin firmar)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Crema.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Crema-ipa
          path: Crema.ipa

      - name: Publicar en "Última versión"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest Crema.ipa --title "Última versión" --notes "IPA sin firmar, compilado desde ${GITHUB_SHA::7}. Instalalo con Sideloadly." --latest
